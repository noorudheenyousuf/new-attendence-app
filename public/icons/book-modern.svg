  <line x1="56" y1="38" x2="70" y2="39" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="56" y1="46" x2="68" y2="47" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
